# --- 通用设置 ---
common:
  log_level: 'INFO'
  HEADLESS_MODE: True
  
data:
  files:
    hl_raw: 'hl_data.csv'                # 主表
    batch_yield: 'batch_yield_data.csv'  # 产出表
    hl_history: 'hl_csv_data.csv'        # [新增] 历史记录表 (用于获取HL时间、次数)
    ct_yield: 'ct_yield_data.csv'        # 明细表
    mwdl_raw: 'mwdl_data.csv'            # 可选
    defect_group_dict: 'imp_ct_dft_group.csv'
    
  # 字段名映射 (可选，用于后续解耦)
  columns:
    prod_code: 'prod_code'
    defect_desc: 'defect_desc'
    batch: 'batch'

path:
  # 输入和缓存路径
  input_path: 'D:/wzy/Python/agents-projects/data/input'
  data_cache_path: 'D:/wzy/Python/agents-projects/data/cache'
  data_raw_dir: 'D:/wzy/Python/agents-projects/data/raw'
  hl_resources_dir: '//10.71.7.15/大数据共享/12.良率监控日报自动化'
  log_dir: 'D:/wzy/Python/agents-projects/logs'

# --- 浏览器基础设施 ---
browser:
  headless: false
  timeout: 30000
  slow_mo: 50

